name = "crimson-lotus-contact"
main = "src/index.js"
compatibility_date = "2025-10-01"
# mimetext's default build imports node:os.
compatibility_flags = ["nodejs_compat"]

# Only reachable at the custom domain below (no *.workers.dev URL).
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.crimsonlotusld.com", custom_domain = true },
]

# Sends mail through Cloudflare Email Routing. The destination must be a
# verified address in Email Routing; keep it in sync with CONTACT_TO below.
[[send_email]]
name = "EMAIL"
destination_address = "crimsonlotuslions@gmail.com"

[vars]
CONTACT_TO = "crimsonlotuslions@gmail.com"
CONTACT_FROM = "contact@crimsonlotusld.com"

# Keeps console.error output in the dashboard (Worker → Logs).
[observability]
enabled = true

# Secrets (set in the dashboard or with `wrangler secret put`, never committed):
#   TURNSTILE_SECRET
