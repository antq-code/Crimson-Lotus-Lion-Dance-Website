name: Build and Deploy

on:
  push:
    branches: [main]
    # Worker-only changes are deployed by deploy-worker.yml; no need to rebuild the site.
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

# Never let two deploys race; a newer push to main replaces a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These run automatically once "lint" / "test" scripts are added to package.json.
      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
